{
    "display_information": {
        "name": "ChatGPT",
        "description": "'AI Slackbot!",
        "background_color": "#000000",
        "long_description": "Slack assistant with chat, image generation, PDF Q&A, and optional Notion wiki search via /wiki."image:\" then your prompt!\r\nEx: ```image: puppy at sunset```\r\n\r\n<https://docs.google.com/document/d/1ndIc9tArln2_EdgNs4mCbfGU73ha1I1yyLJpH6yJ3IY/edit?usp=sharing|Helpful Prompt Examples and Resources>"
    },
    "features": {
        "app_home": {
            "home_tab_enabled": false,
            "messages_tab_enabled": true,
            "messages_tab_read_only_enabled": false
        },
        "bot_user": {
            "display_name": "ChatGPT",
            "always_online": true
        },
        "slash_commands": [
            {
                "command": "/wiki",
                "description": "Search the company wiki",
                "usage_hint": "[keyword]",
                "should_escape": false
            }
        ]
    },
    "oauth_config": {
        "redirect_urls": [
            "https://script.google.com/a/macros/example.com"
        ],
        "scopes": {
            "bot": [
                "app_mentions:read",
                "canvases:read",
                "canvases:write",
                "channels:history",
                "channels:join",
                "chat:write",
                "files:read",
                "files:write",
                "groups:history",
                "im:history",
                "im:read",
                "im:write",
                "incoming-webhook",
                "mpim:history",
                "users:read",
                "workflow.steps:execute"
            ]
        }
    },
    "settings": {
        "event_subscriptions": {
            "bot_events": [
                "app_mention",
                "file_shared",
                "message.channels",
                "message.im"
            ]
        },
        "interactivity": {
            "is_enabled": true
        },
        "org_deploy_enabled": false,
        "socket_mode_enabled": true,
        "token_rotation_enabled": false
    }
}
